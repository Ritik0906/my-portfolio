---
layout: default
---

<header class="intro-header" style="background-color: #1a1a1a; padding: 100px 0;">
    <div class="container">
        <div class="intro-text" style="text-align: center; color: white;">
            <div class="intro-lead-in" style="font-size: 24px; font-style: italic; margin-bottom: 25px;">Welcome To My Portfolio</div>
            <div class="intro-heading" style="font-size: 50px; font-weight: 700; text-transform: uppercase; margin-bottom: 25px;">Data Science & Analytics</div>
            <a href="#portfolio" class="page-scroll btn btn-xl" style="background-color: #fed136; border-color: #fed136; color: white; padding: 10px 20px; font-weight: 700; text-transform: uppercase;">Explore Projects</a>
        </div>
    </div>
</header>

<section id="portfolio" style="padding: 100px 0; background-color: #f8f9fa;">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading" style="text-transform: uppercase; font-size: 40px; margin-bottom: 15px;">Projects</h2>
                <h3 class="section-subheading text-muted" style="font-style: italic; margin-bottom: 50px;">My recent data analytics and data science work.</h3>
            </div>
        </div>
        <div class="row">
            {% for post in site.posts %}
            <div class="col-md-4 col-sm-6 portfolio-item" style="margin-bottom: 30px;">
                <div class="portfolio-caption" style="background-color: white; padding: 25px; text-align: center;">
                    <h4>{{ post.title }}</h4>
                    <p class="text-muted" style="font-style: italic;">{{ post.description }}</p>
                    <a href="{{ post.url | prepend: site.baseurl }}" class="btn btn-sm btn-primary" style="margin-top: 10px;">View Case Study</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
